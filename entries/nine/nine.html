<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nine</title>
    <link rel="stylesheet" href="nine.css">
</head>
<body class="city-default">
  <main class="scene">
    <h1 class="title">CITIES</h1>
    

    <section class="city-ring" aria-label="choose a city">
      <button class="city-btn" data-city="newyork">New York</button>
      <button class="city-btn" data-city="tokyo">Tokyo</button>
      <button class="city-btn" data-city="barcelona">Barcelona</button>
      <button class="city-btn" data-city="auckland">Auckland</button>
    </section>
  </main>


  <section class="cloud" id="cloud" aria-hidden="true"></section>

  <script src="nine.js" defer></script>
</body>

</html>
